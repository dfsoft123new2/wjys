<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棍母</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* 一本正在写的数学书：书页放在桌面上；每章一种墨水颜色；升级是定理，买下就是「证明」 */
:root{--desk:#e6e9ee;--paper:#ffffff;--paper2:#f6f7f9;--ink:#1a1d24;--gr:#5b6270;--gr2:#8b93a0;--rule:#dde1e7;--rule2:#c9ced6;
 --i1:#1f4e8c;--i2:#1b7a6b;--i3:#a86a12;--i4:#6b3fa0;--i5:#b3263e;--i6:#7e6418;--ok:#2d7a4b;--warn:#a8590f;
 --serif:"Noto Serif SC","Songti SC","STSong",serif;--math:"STIX Two Text","Times New Roman",serif;--sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 --ic:var(--i1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0d1215;--paper:#161d21;--paper2:#1b2328;--ink:#e6ebee;--gr:#9ba6ad;--gr2:#6f7b83;--rule:#26313a;--rule2:#33414b;
 --i1:#86aee8;--i2:#5cc4b0;--i3:#e1a752;--i4:#b394ee;--i5:#ef7a8f;--i6:#d8bd62;--ok:#6cc48d;--warn:#e9a25a;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#0d1215;--paper:#161d21;--paper2:#1b2328;--ink:#e6ebee;--gr:#9ba6ad;--gr2:#6f7b83;--rule:#26313a;--rule2:#33414b;
 --i1:#86aee8;--i2:#5cc4b0;--i3:#e1a752;--i4:#b394ee;--i5:#ef7a8f;--i6:#d8bd62;--ok:#6cc48d;--warn:#e9a25a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--desk);color:var(--ink)}
body{font:16px/1.7 var(--serif);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ic);outline-offset:2px}
.num,.mono{font-family:var(--math);font-variant-numeric:lining-nums tabular-nums}
i.mv,.mv{font:italic 400 1.08em var(--math)}
#app{max-width:1180px;margin:0 auto;padding:18px 18px 28px}
/* 书脊上方的标题栏 */
.top{display:flex;align-items:baseline;gap:14px;padding:4px 6px 14px}
.brand{font:900 21px/1 var(--serif);letter-spacing:3px;display:flex;align-items:baseline;gap:10px}
.brand .sig{font:italic 600 28px/1 var(--math);color:var(--ic);letter-spacing:0}
.brand small{font:400 12px var(--sans);letter-spacing:0;color:var(--gr2)}
#chap{font:400 14px var(--serif);color:var(--gr)}
.sp{flex:1}
.lnk{border:none;background:none;padding:4px 2px;font:400 14px var(--serif);color:var(--gr);cursor:pointer;border-bottom:1px solid transparent}
.lnk:hover,.lnk.on{color:var(--ink);border-bottom-color:var(--ink)}
/* 书页 */
.page{background:var(--paper);border-radius:3px;box-shadow:0 1px 0 var(--rule2),0 18px 40px -24px rgba(20,30,50,.35);position:relative}
.hero{padding:30px 40px 22px;border-bottom:1px solid var(--rule)}
.hero-top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.pts{font:400 clamp(34px,5.4vw,54px)/1 var(--math);letter-spacing:-.5px}
.pts sup{font-size:.5em;letter-spacing:0}
.pts-l{font:400 14px var(--serif);color:var(--gr);margin-top:8px}
.rate{font:400 15px var(--serif);color:var(--gr);margin-left:auto;text-align:right}
.rate b{font:400 17px var(--math);color:var(--ink)}
.rate .soft{display:block;font-size:12.5px;color:var(--warn)}
/* 陈列公式：居中、右侧带公式编号 */
.eqn{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:26px 0 6px}
.formula{grid-column:2;font:400 clamp(24px,3.6vw,38px)/1.35 var(--math);white-space:nowrap;overflow-x:auto;padding:2px 4px}
.formula i{font-style:italic}.formula sup{font-size:.6em;margin-left:1px}
.formula .v{color:var(--i1)}.formula .x{color:var(--i2)}.formula .g{color:var(--i3)}.formula .l{color:var(--i4)}.formula .w{color:var(--i5)}.formula .m{color:var(--ink)}.formula .o{color:var(--gr2);padding:0 .14em;font-style:normal}
.eqno{grid-column:3;justify-self:end;font:400 17px var(--math);color:var(--gr2)}
.reads{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;font:400 13.5px var(--serif);color:var(--gr);margin-bottom:18px}
.reads .chip i{font:italic 600 16px var(--math);color:var(--ink);margin-right:5px}
.reads .chip span{font-family:var(--math)}
/* 晋升：两条刻度线 */
.promo{display:grid;grid-template-columns:1fr 1fr auto;gap:12px 28px;align-items:end;padding-top:16px;border-top:1px dashed var(--rule2)}
.promo .lab{display:flex;justify-content:space-between;gap:10px;font:400 13.5px var(--serif);color:var(--gr)}
.promo .lab span:last-child{font-family:var(--math);color:var(--ink)}
.bar{height:2px;background:var(--rule);margin-top:9px;position:relative}
.bar>div{height:100%;width:0;background:var(--ic);position:relative;transition:width .3s}
.bar>div::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ic)}
/* 正文：左侧目录 + 章节 */
.main{display:grid;grid-template-columns:220px 1fr;min-height:420px}
.rail{padding:26px 0 26px 26px;border-right:1px solid var(--rule)}
.rail h4{margin:0 0 12px;font:600 13px var(--serif);color:var(--gr2);letter-spacing:2px}
.toc{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;width:100%;border:none;background:none;text-align:left;padding:9px 16px 9px 0;cursor:pointer;position:relative;color:var(--gr)}
.toc .n{font:600 15px var(--serif);color:var(--sc)}
.toc .t{display:flex;align-items:baseline;gap:6px;min-width:0}
.toc .t b{font:600 15px var(--serif);color:var(--ink);flex:none}
.toc .t::after{content:"";flex:1;border-bottom:1px dotted var(--rule2);transform:translateY(-4px)}
.toc .v{grid-column:2;font:400 12.5px var(--math);color:var(--gr2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc.on{color:var(--ink)}.toc.on::before{content:"";position:absolute;left:-26px;top:10px;bottom:10px;width:3px;background:var(--sc)}
.toc .dot{position:absolute;right:6px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--sc)}
.view{padding:26px 36px 32px;min-width:0}
/* 章节标题 */
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 26px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.shead .ct{flex:1;min-width:220px}
.shead .cn{font:400 14px var(--serif);color:var(--sc);letter-spacing:1px}
.shead h2{margin:2px 0 4px;font:900 30px/1.2 var(--serif);letter-spacing:2px}
.shead .d{font:400 14px var(--serif);color:var(--gr)}
.shead .cur{font:400 26px/1.1 var(--math)}
.shead .cur+.d{margin-top:4px}
.shead .act{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.autorow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gr)}
/* 小节链接 */
.tabs{display:flex;gap:4px 22px;flex-wrap:wrap;margin:16px 0 22px}
.tab{border:none;background:none;padding:4px 0;cursor:pointer;font:400 15px var(--serif);color:var(--gr);border-bottom:2px solid transparent}
.tab::before{content:attr(data-sn);font:400 14px var(--math);color:var(--gr2);margin-right:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--sc)}
/* 按钮 */
.btn{border:1px solid var(--rule2);background:var(--paper);border-radius:6px;padding:7px 14px;cursor:pointer;font:600 14px var(--serif);color:var(--ink);text-align:left;line-height:1.35}
.btn small{display:block;font:400 12px var(--math);color:var(--gr)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.go{background:var(--sc,var(--ic));border-color:var(--sc,var(--ic));color:var(--paper)}
.btn.go small{color:color-mix(in srgb,var(--paper) 80%,transparent)}
.btn:disabled{opacity:.42;cursor:default}
.btn.lg{padding:10px 20px;font-size:16px}
.btn.promo-b{background:var(--ink);border-color:var(--ink);color:var(--paper)}.btn.promo-b small{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.buy{background:transparent;border-color:color-mix(in srgb,var(--sc,var(--ic)) 55%,var(--rule2));color:var(--sc,var(--ic))}
.btn.buy small{color:var(--gr)}
.btn.buy:hover:not(:disabled){background:color-mix(in srgb,var(--sc,var(--ic)) 8%,transparent);border-color:var(--sc,var(--ic))}
.btn.buy:disabled{color:var(--gr);border-color:var(--rule2)}
.card .btn,.fig .btn{align-self:flex-start}
table.gn .btn{padding:4px 11px;font-size:13px}
/* 内容：默认是正文中的条目，只有图才装框 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:0 34px}
.card{padding:16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;min-width:0}
.card.wide{grid-column:1/-1}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .nm{font:600 16px var(--serif)}.card .nm i{font:italic 600 19px var(--math)}
.card .ds{font:400 14px/1.6 var(--serif);color:var(--gr)}
.card .ds b{color:var(--ink);font-weight:600}
.card.own .nm{color:var(--sc)}
.card.dim{color:var(--gr2)}.card.dim .nm{color:var(--gr)}
.pill{font:400 13px var(--math);color:var(--gr);white-space:nowrap}
.pill.ok{color:var(--ok)}
.big{font:400 24px/1.25 var(--math)}
.note{font:400 13.5px/1.7 var(--serif);color:var(--gr);margin:14px 0 0;max-width:62em}
.tgl{display:inline-flex;gap:6px;align-items:center;font:400 13.5px var(--serif);color:var(--gr);cursor:pointer}
.tgl input{accent-color:var(--sc,var(--ic))}
input[type=text]{width:58px;border:1px solid var(--rule2);background:var(--paper);border-radius:5px;padding:3px 6px;font:400 14px var(--math)}
textarea{border:1px solid var(--rule2);border-radius:5px;background:var(--paper2);padding:8px}
/* 定理：升级树 */
.thms{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:0 34px}
.thm{padding:15px 0 14px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:start}
.thm .th{font:400 15px/1.5 var(--serif)}
.thm .th b{font-weight:900;color:var(--sc)}
.thm .st{grid-column:1;font:italic 400 15px/1.6 var(--serif);color:var(--ink)}
.thm .c{grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.thm.own .st::after{content:"∎";font-style:normal;margin-left:8px;color:var(--sc)}
.thm.own .th b{color:var(--ink)}
.thm:not(.own) .st{color:var(--gr)}
/* 图：分形与多边形 */
.fig{padding:16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.cv{width:100%;aspect-ratio:1.55;border:1px solid var(--rule);border-radius:3px;background:var(--paper2)}
.cap{font:400 13px var(--serif);color:var(--gr)}.cap b{color:var(--ink);font-weight:600}
.sv-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-top:10px;border:1px solid var(--rule)}
.sv-grid span{aspect-ratio:1;font:400 10px var(--math);display:grid;place-items:center;color:var(--gr2);background:var(--paper)}
.sv-grid span.p{color:var(--paper);background:var(--i1)}
.term{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--rule2)}
.term:last-of-type{border:none}
.term .f{font:400 15px var(--serif)}
.pm{display:flex;gap:6px;align-items:center;font-family:var(--math)}
.pm button{width:28px;height:28px;border-radius:5px;border:1px solid var(--rule2);background:var(--paper);cursor:pointer}
/* 构造台 */
.slots{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:18px 0 14px}
.slot{min-width:58px;height:62px;border:1px dashed var(--rule2);border-radius:4px;display:grid;place-items:center;font:italic 400 28px var(--math);cursor:pointer;background:var(--paper)}
.slot.f{border-style:solid;border-color:var(--ink)}.slot.sel{border-color:var(--sc);box-shadow:0 0 0 2px var(--sc)}
.jn{border:none;background:none;font:400 22px var(--math);color:var(--gr2);cursor:pointer;padding:0 3px}
.pal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pal button{min-width:44px;height:40px;border-radius:4px;border:1px solid var(--rule2);background:var(--paper);font:italic 400 20px var(--math);cursor:pointer}
.mx{display:grid;gap:5px;max-width:320px;margin:12px 0}
.mxc{aspect-ratio:1;border:1px dashed var(--rule2);border-radius:3px;background:var(--paper);display:grid;place-items:center;font:400 22px var(--math);cursor:pointer}
.mxc.f{border-style:solid;border-color:var(--i2)}.mxc.b{border-style:solid;border-color:var(--i3)}.mxc.sel{box-shadow:0 0 0 2px var(--sc)}
.mxc small{display:block;font:400 11px var(--math);color:var(--gr)}
table.gn{width:100%;border-collapse:collapse;font:400 14.5px var(--math)}
table.gn th{font:400 13px var(--serif);color:var(--gr);text-align:right;padding:8px 6px;border-bottom:1px solid var(--rule2)}
table.gn td{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.gn td:first-child,table.gn th:first-child{text-align:left;font-family:var(--serif)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 24px;font:400 15px var(--serif)}.kv span:nth-child(odd){color:var(--gr)}.kv span:nth-child(even){font-family:var(--math)}
/* 页脚签名（你加的） */
.signature{display:flex;justify-content:flex-end;align-items:baseline;gap:5px;margin-top:18px;color:var(--gr);font:20px/1 var(--math)}
.signature-limit{display:inline-flex;flex-direction:column;align-items:center}
.signature-limit small{font-size:10px;line-height:1.15;white-space:nowrap}
/* 提示与对话 */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(340px,calc(100vw - 36px))}
.toast{background:var(--paper);border:1px solid var(--rule2);border-left:3px solid var(--ic);border-radius:4px;padding:10px 14px;box-shadow:0 10px 26px -14px rgba(20,30,50,.45);font:400 14px var(--serif)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .22s ease-out}@keyframes tin{from{transform:translateY(6px);opacity:0}}}
#modal{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--desk) 70%,transparent);backdrop-filter:blur(3px);z-index:60;padding:18px}
#modal.on{display:grid}
#modal .box{background:var(--paper);border-radius:3px;max-width:540px;width:100%;padding:28px 32px;box-shadow:0 30px 60px -30px rgba(20,30,50,.6);max-height:86vh;overflow:auto;border-top:3px solid var(--ic)}
#modal h3{margin:0 0 10px;font:900 24px/1.3 var(--serif);letter-spacing:1px}
#modal p{font:400 15.5px/1.85 var(--serif);color:var(--gr);margin:10px 0}#modal p b{color:var(--ink)}
@media (max-width:860px){#app{padding:10px 10px 22px}.hero{padding:22px 20px 18px}.main{grid-template-columns:1fr}.rail{border-right:none;border-bottom:1px solid var(--rule);padding:14px 16px 10px;display:flex;gap:4px 18px;overflow-x:auto}.rail h4{display:none}
 .toc{flex:none;width:auto;padding:6px 10px 8px 0}.toc .t::after{display:none}.toc.on::before{left:0;right:10px;top:auto;bottom:0;width:auto;height:2px}.view{padding:20px 18px 24px}.promo{grid-template-columns:1fr}.eqn{grid-template-columns:0 auto 1fr}}
@media (max-width:520px){.top{flex-wrap:wrap;gap:4px 12px;padding-bottom:10px}.top .sp{flex-basis:100%;height:0}.lnk{font-size:13.5px}.brand{font-size:19px}.main{grid-template-columns:minmax(0,1fr)}.hero{padding:18px 16px 14px}.view{padding:18px 14px 22px}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand"><span class="sig">Σ</span>棍母<small>0.0.0</small></div><span id="chap"></span><span class="sp"></span>
    <button class="lnk" data-a="g:ach">成就</button><button class="lnk" data-a="g:stat">统计</button><button class="lnk" data-a="g:opt">设置</button><button class="lnk" data-a="theme" aria-label="切换深浅色">◐</button></header>
  <div class="page">
    <section class="hero" id="hero">
      <div class="hero-top"><div><div class="pts num" id="pts">0</div><div class="pts-l" id="ptsN">点数</div></div><div class="rate" id="rate"></div></div>
      <div class="eqn"><div class="formula" id="formula"></div><div class="eqno" id="eqno"></div></div><div class="reads" id="reads"></div>
      <div class="promo" id="promo"></div>
    </section>
    <div class="main"><nav class="rail" id="rail" aria-label="目录"></nav><main class="view" id="view"></main></div>
  </div>
  <footer class="signature" aria-label="lim，n 趋于无穷，you"><span class="signature-limit">lim<small>n → ∞</small></span><i>you</i></footer>
</div>
<div id="toasts" aria-live="polite"></div><div id="modal" role="dialog" aria-modal="true"></div>
<script>
/* ===================== 层塔 TowerNum —— 无尽演算的大数库（v1.5.2） =====================
 * 每个数是一个普通对象 { s, k, m, e }：
 *   s：符号 −1 / 0 / 1
 *   k = 0（科学层）：值 = s · m · 10^e，1 ≤ m < 10，e 为整数，|e| ≤ 9e15 —— 约 15 位有效数字
 *   k ≥ 2（塔层）：值 = s · 10^10^…^m（共 k 个 10），m ∈ [15.95, 9e15)，e 不使用
 *   （k = 1 不使用：科学层已覆盖到 10^(9e15)）
 * 可表示到远超 10↑↑10 的数；所有运算都只使用普通对象，便于 V8 优化，也能直接存档。
 */
const TN_EMAX = 9e15, TN_LMAX = Math.log10(9e15);
function tnMk(s, k, m, e) { return { s: s, k: k, m: m, e: e }; }
const TN_ZERO = tnMk(0, 0, 0, 0), TN_ONE = tnMk(1, 0, 1, 0);
function tnSci(s, m, e) { // 规范化科学层
  if (m === 0 || s === 0) return TN_ZERO;
  if (m >= 10 || m < 1) { const d = Math.floor(Math.log10(m)); m /= Math.pow(10, d); e += d; if (m >= 10) { m /= 10; e += 1; } else if (m < 1) { m *= 10; e -= 1; } }
  if (e >= TN_EMAX) return tnTower(s, 2, Math.log10(e + Math.log10(m)));
  if (e <= -TN_EMAX) return TN_ZERO;
  return tnMk(s, 0, m, e);
}
function tnTower(s, k, v) { // 规范化塔层：值 = 10^…^v（k 个 10）
  while (v >= TN_EMAX) { v = Math.log10(v); k++; }
  while (k >= 2 && v < TN_LMAX) { if (k === 2) return tnFromLog(Math.pow(10, v), s); v = Math.pow(10, v); k--; }
  return tnMk(s, k, v, 0);
}
function tn(x) { // 普通数字 → 层塔
  if (x === 0 || x !== x) return TN_ZERO;
  const s = x < 0 ? -1 : 1, a = Math.abs(x);
  if (a === Infinity) return tnMk(s, 0, 1.7976931348623157, 308);
  const e = Math.floor(Math.log10(a)); return tnSci(s, a / Math.pow(10, e), e);
}
function tnFromLog(L, s) { // 值 = 10^L（L 为普通数字）
  s = s || 1; if (L !== L) return TN_ZERO;
  if (L >= TN_EMAX) return tnTower(s, 2, Math.log10(L));
  if (L <= -TN_EMAX) return TN_ZERO;
  const e = Math.floor(L); let m = Math.pow(10, L - e); if (m >= 10) { m = 1; return tnMk(s, 0, m, e + 1); } return tnMk(s, 0, m, e);
}
function tnClone(a) { return tnMk(a.s, a.k, a.m, a.e); }
function tnIs(a) { return !!a && typeof a === 'object' && 'k' in a && 'm' in a; }

V['6cx'] = () => { const u = S.ult; return `<p class="note">把公式搭成特定的形状就会被收录；每种形状让终极点获取永久 ×${ru(S, 'u10') ? 3 : 2}。已收录 ${Object.keys(u.cx).length} / ${UCX.length}。</p>

V['6mx'] = () => { const m = S.ult.mx, N = m.n, calc = mxCalc(S), used = t => m.c.slice(0, N * N).filter(x => x === t).length; let g = '';

/* ---------- 全局页面 ---------- */
V.ach = () => `<p class="note">已达成 ${achN(S)} / ${ACH.length}。每个成就让终极点获取 ×1.03。</p><div class="grid">${ACH.map((a, i) => `<div class="card ${S.ach[i] ? 'own' : 'dim'}"><div class="hd"><span class="nm">${a[0]}</span>${S.ach[i] ? '<span class="pill ok">✓</span>' : ''}</div><div class="ds">${a[1]}</div></div>`).join('')}</div>`;

V.opt = () => `<div class="grid"><div class="card"><div class="nm">外观</div><div class="row"><button class="btn" data-a="th:0">跟随系统</button><button class="btn" data-a="th:1">浅色</button><button class="btn" data-a="th:2">深色</button></div></div>

/* ---------- 渲染 ---------- */
function curTabs() { return (SUB[UI.sel] || []).filter(t => !t[2] || t[2](S)); }
function sigOf() { const u = S.ult; return JSON.stringify([UI.sel, UI.gsel, UI.tab[UI.sel], S.sec, Object.keys(S.up).length, S.brk, Object.keys(S.pg).length, svOn(S), poOn(S), frOn(S), pgOn(S), mpOn(S), gnOn(S), S.mp.n, ['C', 'R', 'G', 'E', 'I', 'c', 'l', 'ab'].map(k => autoOn(S, k)),
  u ? [u.f, UI.slot, u.tok, u.unl, u.cn, Object.keys(u.cx).length, Object.keys(u.rup).length, u.mx, UI.mxSel] : 0, achN(S), S.sv.L, S.frL]); }
function heroUpdate() { const ult = S.sec >= 6 && S.ult, t = sciHTML(ult ? tL(S.ult.U) : tL(S.P)); if ($('pts').innerHTML !== t) $('pts').innerHTML = t;
  const r = ult ? `每秒增加 <b>${G.uRate > NI ? sciHTML(G.uRate) : '0'}</b>` : `每秒增加 <b>${sciHTML(G.rate)}</b>${G.soft ? '<span class="soft">已超过本章目标，超出部分按平方根增长</span>' : ''}`; if ($('rate').innerHTML !== r) $('rate').innerHTML = r; }
function render() { BF = []; const k = Math.min(UI.sel, S.sec); UI.sel = k;
  document.documentElement.style.setProperty('--ic', SC[S.sec]); $('chap').textContent = chName(S.sec); $('eqno').textContent = '(' + S.sec + ')'; $('view').style.setProperty('--sc', UI.gsel ? SC[S.sec] : SC[k]);

  if (UI.gsel) h = `<div class="shead"><div class="ct"><div class="cn">附录</div><h2>${{ ach: '成就', stat: '统计', opt: '设置' }[UI.gsel]}</h2></div><div class="act"><button class="btn" data-a="g:">回到正文</button></div></div><div style="margin-top:14px">${V[UI.gsel]()}</div>`;
  else { const tabs = curTabs(); let t = UI.tab[k]; if (!tabs.some(x => x[0] === t)) t = UI.tab[k] = tabs[0][0];
    h = headHTML(k) + `<div class="tabs">${tabs.map((x, i) => `<button class="tab ${x[0] === t ? 'on' : ''}" data-a="tab:${x[0]}" data-sn="§${k}.${i + 1}">${x[1]}</button>`).join('')}</div>` + (t === 'up' ? upTreeHTML(k) : V[k + t]()); }
  $('view').innerHTML = h; document.querySelectorAll('.lnk').forEach(b => b.classList.toggle('on', b.dataset.a === 'g:' + UI.gsel));
  UI.sig = sigOf(); bindAll(); drawAll(); }
function drawAll() { if (UI.gsel) return; const t = UI.tab[UI.sel];
  if (UI.sel === 3 && t === 'fr') FR.forEach(f => drawFractal('fr_' + f.id, f.id, S.fr[f.id]));

  if (UI.sel === 2 && t === 'po') drawPolyGraph('pocv'); }
/* ---------- 操作 ---------- */
function applyTheme() { const t = S.opt.theme || 0; if (t === 1) document.documentElement.dataset.theme = 'light'; else if (t === 2) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme; }
function save() { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, serialize(S)); } catch (e) { } }
function story(k) { const s = STORY[k]; if (s) modal(`<h3>${s[0]}</h3><p>${s[1]}</p>`); }
function act(a) { const p = a.split(':'), u = S.ult;
  switch (p[0]) {
    case 'sel': UI.sel = +p[1]; UI.gsel = ''; UI.slot = -1; break;
    case 'tab': UI.tab[UI.sel] = p[1]; UI.slot = -1; break;
    case 'g': UI.gsel = UI.gsel === p[1] ? '' : p[1]; break;
    case 'theme': S.opt.theme = ((S.opt.theme || 0) + 1) % 3; applyTheme(); break;
    case 'th': S.opt.theme = +p[1]; applyTheme(); break;
    case 'buyA': buyA(S); break; case 'buyB': buyB(S); break; case 'maxA': buyMax(S, buyA); break; case 'maxB': buyMax(S, buyB); break;
    case 'maxAB': for (let i = 0; i < 400; i++) { const ca = aCost(S, S.lv.a), cb = bCost(S, S.lv.b), lp = tL(S.P); if (cb <= lp && cb <= ca + 1) buyB(S); else if (ca <= lp) buyA(S); else break; } break;
    case 'buyC': buyC(S); break; case 'maxC': buyMax(S, buyC); break; case 'buyL': buyL(S); break; case 'maxL': buyMax(S, buyL); break;
    case 'up': if (buyUp(S, p[1])) toast((THM.test(UPM[p[1]].n) ? '证明了' : '引入了') + '「' + UPM[p[1]].n + '」', SC[UPM[p[1]].s]); break;
    case 'rs': { const g = doReset(S, +p[1]); if (g) toast(SEC[+p[1] - 1].act + '：+' + tnFmt(g) + ' ' + SEC[+p[1] - 1].curN, SC[+p[1]]); break; }
    case 'promo': if (canPromote(S)) modal(`<h3>${S.sec === 5 ? '终极晋升' : '晋升到' + CHN[S.sec + 1]}</h3><p>晋升会清空<b>点数、因子 a 与 b、各层货币</b>；所有升级、c 与 λ 的等级、各个衍生玩法的进度全部保留。公式将获得新的运算，新的板块随之开放。</p>`, [['再想想', null], ['晋升', () => { if (doPromote(S)) { UI.sel = S.sec; UI.gsel = ''; story(S.sec); save(); } }, 'go']]); break;
    case 'sv': svBuy(S); break; case 'po': poSet(S, +p[1], +p[2]); break; case 'pobest': poBest(S); break; case 'fr': frBuy(S, p[1]); break;
    case 'pg': if (pgBuy(S, +p[1])) toast('作出了' + PG.find(x => x.n === +p[1]).nm, SC[3]); break;
    case 'se': seBuy(S, p[1]); break; case 'gn': gnBuy(S, +p[1]); break;
    case 'gnmax': for (let i = 0; i < 300; i++) { let bk = -1, bc = Infinity; for (let k = 0; k < 8; k++) { const c = gnCost(k, S.gn.b[k]); if (c < bc) { bc = c; bk = k; } } if (bc > tL(S.cur.I) || !gnBuy(S, bk)) break; } break;
    case 'mp': mpBuy(S); break;
    case 'slot': UI.slot = UI.slot === +p[1] ? -1 : +p[1]; break;
    case 'pal': if (UI.slot >= 0) { const v = p[1] || ''; if (v) u.f.s.forEach((t, i) => { if (t && t.v === v && i !== UI.slot) u.f.s[i] = { v: '', p: 1 }; }); u.f.s[UI.slot] = { v, p: v && UV[v] ? (u.f.s[UI.slot].p || 1) : 1 }; } break;
    case 'pw': if (UI.slot >= 0 && u.f.s[UI.slot].v) u.f.s[UI.slot].p = +p[1]; break;
    case 'jn': u.f.j[+p[1]] = u.f.j[+p[1]] === '+' ? '×' : '+'; break;
    case 'tok': tokBuy(S, p[1]); break; case 'unl': if (unlBuy(S, p[1])) toast('解锁了 ' + TOKN[p[1]], SC[6]); break;
    case 'lv': uLvBuy(S, p[1]); break; case 'lvmax': buyMax(S, s => uLvBuy(s, p[1]), 500); break;
    case 'rf': { const g = doRf(S); if (g) toast('重构：+' + tnFmt(g) + ' 范式点', SC[6]); break; }
    case 'rup': if (buyRup(S, p[1])) toast('获得「' + RUM[p[1]].n + '」', SC[6]); break;
    case 'mxs': UI.mxSel = +p[1]; break; case 'mxp': if (!mxPlace(S, UI.mxSel, p[1])) toast('这种已经全部放进矩阵了'); break; case 'mxc': mxPlace(S, UI.mxSel, ''); break;
    case 'mxb': mxBuy(S, p[1]); break; case 'mxg': mxGrow(S); break;
    case 'save': save(); toast('已保存'); break;
    case 'exp': modal(`<h3>导出存档</h3><p>复制下面的文字保存好。</p><textarea style="width:100%;height:120px" readonly>${esc(btoa(unescape(encodeURIComponent(serialize(S)))))}</textarea>`); break;
    case 'imp': modal(`<h3>导入存档</h3><textarea id="impT" style="width:100%;height:120px" placeholder="粘贴导出的文字"></textarea>`, [['取消', null], ['导入', () => { try { S = deserialize(decodeURIComponent(escape(atob($('impT').value.trim())))); applyTheme(); save(); toast('导入成功'); UI.sig = ''; } catch (e) { toast('导入失败：存档格式不对'); } }, 'go']]); break;

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) act(el.dataset.a); });

  else if (a === 'urfauto') S.ult.auto.rf = el.checked ? 1 : 0; else if (a === 'urfx') S.ult.auto.x = el.value; else if (a === 'ulvauto') S.ult.auto.lv = el.checked ? 1 : 0; });
/* ---------- 主循环 ---------- */
let lastT = performance.now(), acc = 0, lastSave = Date.now(), lastBind = 0, lastDraw = 0;

function loop(now) { let dt = (now - lastT) / 1000; lastT = now; if (dt > 3) offline(S, dt); else { acc += dt; while (acc >= 0.1) { step(S, 0.1); acc -= 0.1; } }

  if (Date.now() - lastSave > 15000) { lastSave = Date.now(); save(); } requestAnimationFrame(loop); }

  else if (!S.seen.intro) { S.seen.intro = 1; modal('<h3>棍母 0.0</h3><p>一切从一个数开始。购买因子 <b>a</b> 与 <b>b</b>，让点数增长；点数够了就<b>进位</b>，换取进位点和升级。</p><p>每一章的目标写在公式下方：达成点数目标和本章里程碑后即可<b>晋升</b>，公式会获得新的运算，新的板块随之开放。一共五章，加上终章。</p>'); }
  UI.sel = S.sec; render(); requestAnimationFrame(loop); }
