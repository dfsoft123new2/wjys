<!DOCTYPE html>
<html lang="zh-CN" data-skin="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无尽演算 v1.5.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1F6; --paper:#F6FAFC; --panel:#FFFFFF; --line:rgba(16,46,76,.10); --line2:rgba(16,46,76,.22);
  --ink:#0F2B46; --muted:#4D6A85; --faint:#8AA2B8;
  --amber:#A66A00; --amberBg:rgba(214,150,20,.13); --cyan:#0A6C96; --cyanBg:rgba(10,108,150,.09);
  --coral:#B8432A; --green:#2D7F4A; --greenBg:rgba(45,127,74,.10);
  --shadow:0 1px 0 rgba(16,46,76,.06);
  --serif:"STIX Two Text","Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D2742; --paper:#10304F; --panel:#143858; --line:rgba(170,210,245,.10); --line2:rgba(170,210,245,.24);
  --ink:#E9F2F9; --muted:#A3BCD2; --faint:#6F8DA8;
  --amber:#F4BC4E; --amberBg:rgba(244,188,78,.13); --cyan:#82D4F4; --cyanBg:rgba(130,212,244,.10);
  --coral:#FF9073; --green:#8FDBA6; --greenBg:rgba(143,219,166,.12); --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D2742; --paper:#10304F; --panel:#143858; --line:rgba(170,210,245,.10); --line2:rgba(170,210,245,.24);
  --ink:#E9F2F9; --muted:#A3BCD2; --faint:#6F8DA8;
  --amber:#F4BC4E; --amberBg:rgba(244,188,78,.13); --cyan:#82D4F4; --cyanBg:rgba(130,212,244,.10);
  --coral:#FF9073; --green:#8FDBA6; --greenBg:rgba(143,219,166,.12); --shadow:none; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
body{margin:0;padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px);background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}

/* 顶部 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 4px}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.02em}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.tierb{font-family:var(--serif);font-size:15px;color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:2px 12px;white-space:nowrap}

/* 公式（主视觉） */
.hero{position:relative;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:18px 18px 14px;margin:8px 0 12px;box-shadow:var(--shadow);overflow:hidden}
.pts{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.pts .big{font-family:var(--serif);font-size:clamp(30px,6vw,46px);font-weight:600;line-height:1.1}
.pts .lbl{color:var(--muted);font-size:13px}
.rate{color:var(--muted);font-size:13px}
.rate b{color:var(--ink);font-weight:500}
.formula{font-family:var(--serif);font-size:clamp(22px,4.6vw,38px);text-align:center;margin:16px 0 8px;line-height:1.5;word-spacing:.05em;overflow-x:auto;white-space:nowrap;padding-bottom:4px}
.formula.t6{font-size:clamp(14px,3.4vw,34px)}
.formula sup sup{font-size:.7em;vertical-align:.8em}
.formula sup{font-size:.58em;vertical-align:.95em;margin-left:1px}
.formula i{font-style:italic;cursor:pointer;padding:0 1px;border-radius:4px}
.formula i:hover{background:var(--cyanBg)}
.formula .fp{color:var(--amber)} .formula .fl{color:var(--cyan)} .formula .ft{color:var(--coral)}
.formula .op{color:var(--muted);padding:0 .12em}
.reads{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:2px}
.chip{font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:1px 10px;color:var(--muted);background:var(--panel)}
.chip i{font-family:var(--serif);font-size:14px;color:var(--ink);margin-right:4px}
.tickbar{height:4px;border-radius:2px;background:var(--line);margin:12px 0 2px;overflow:hidden}
.tickbar div{height:100%;width:0;background:var(--amber)}
.tickbar.fast div{width:100%!important;opacity:.55;background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 14px);animation:slide 0.6s linear infinite}
@keyframes slide{from{background-position:0 0}to{background-position:14px 0}}
.ticknote{font-size:12px;color:var(--faint);display:flex;justify-content:space-between}
.boost{color:var(--coral)}

/* 货币与快捷重置 */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cur{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;min-width:120px;box-shadow:var(--shadow)}
.cur .k{font-size:12px;color:var(--muted)}
.cur .v{font-family:var(--serif);font-size:19px;font-weight:600}
.cur .s{font-size:11.5px;color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 14px;cursor:pointer;min-height:38px;text-align:left;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{border-color:var(--amber);background:var(--amberBg)}
.btn.cy{border-color:var(--cyan);background:var(--cyanBg)}
.btn.warn{border-color:var(--coral);color:var(--coral)}
.btn small{display:block;font-size:11.5px;color:var(--muted)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}

/* 页签 */
.nav-dock{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-anchor:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:500}
.tab .dot{position:absolute;top:7px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.tab-picker{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;align-self:center;min-height:36px;padding:0 9px;margin:3px 0;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--ink);font-size:12px;white-space:nowrap}
.tab-picker b{font:19px/1 var(--serif);color:var(--cyan)}
.tab-picker select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tab-picker:focus-within{outline:2px solid var(--amber);outline-offset:-2px}
.tabs .tab:focus-visible{outline-offset:-3px}

/* 通用面板 */
.sec{margin:18px 0 8px;font-family:var(--serif);font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .h{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.card.dim{opacity:.55}
.card .t{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px}
.card .sym{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--amber)}
.card .sym.l{color:var(--cyan)}
.card .nm{font-weight:500}
.card .ds{font-size:13px;color:var(--muted);margin:4px 0}
.card .fm{font-family:var(--serif);font-size:15px;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .ok{color:var(--green)} .am{color:var(--amber)} .cy{color:var(--cyan)} .co{color:var(--coral)}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.pill{font-size:11.5px;border-radius:999px;padding:0 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--green);color:var(--green)}
.pill.am{border-color:var(--amber);color:var(--amber)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--cyan)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.tgl input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px}
select,input[type=text],textarea{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:4px 8px}
input[type=text]{width:110px}
textarea{width:100%;min-height:90px;font-size:12px}
.ms li{margin:2px 0}
ul.ms{padding-left:18px;margin:6px 0;font-size:13.5px}
.ms .got{color:var(--green)}

/* 升级树 */
.treebox{position:relative;margin:6px 0 10px;--rh:96px}
.treebox svg{position:absolute;inset:0;width:100%;pointer-events:none}
.treebox path{stroke:var(--line2);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.treebox path.own{stroke:var(--cyan)}
.node{position:absolute;width:31%;transform:translateX(-50%);height:calc(var(--rh) - 14px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.node .nn{font-weight:500;font-size:13.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 4px}
.node .nd{font-size:12px;color:var(--muted);line-height:1.35;flex:1;overflow:hidden}
.node .nc{font-size:11.5px;color:var(--faint)}
.node.own{background:var(--cyanBg);border-color:var(--cyan)}
.node.own .nc{color:var(--cyan)}
.node.can{border-color:var(--amber);background:var(--amberBg)}
.node.alt{opacity:.38;border-style:dashed}
.node.res,.node.pre{opacity:.62}
.node .fork{font-size:10.5px;color:var(--coral);border:1px solid var(--coral);border-radius:999px;padding:0 5px;white-space:nowrap;align-self:flex-start}
.tierline{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);font-size:11px;color:var(--faint);padding-left:2px}

/* 幻方 */
.msq{display:grid;gap:4px;margin:8px 0}
.msq button{aspect-ratio:1;border:1px solid var(--line2);background:var(--panel);border-radius:8px;font-family:var(--serif);font-size:clamp(16px,4vw,24px);cursor:pointer;min-width:0;padding:0}
.msq button.lineok{background:var(--greenBg);border-color:var(--green)}
.msq .sum{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;color:var(--faint)}
.msq .sum.ok{color:var(--green)}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.pal button{width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-family:var(--serif);font-size:16px;cursor:pointer}
.pal button.sel{border-color:var(--amber);background:var(--amberBg)}
.pal button.used{opacity:.35}

/* 素数 */
.sieve{font-family:var(--serif);font-size:clamp(24px,5vw,34px);font-weight:600;word-break:break-all}

/* 灵光 */
.spark{position:absolute;width:42px;height:42px;border-radius:50%;border:1px solid var(--amber);background:var(--amberBg);color:var(--amber);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite;z-index:3}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.spark,.tickbar.fast div{animation:none}}

/* 提示与弹窗 */
.toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30;width:max-content;max-width:min(360px,calc(100% - max(12px,env(safe-area-inset-right,0px)) - max(12px,env(safe-area-inset-left,0px))));pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:9px;padding:8px 12px;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:rgba(6,20,34,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:520px;width:100%;padding:18px 20px;max-height:100%;overflow:auto;overscroll-behavior:contain;overflow-wrap:anywhere}
html.modal-open{overflow:hidden}
.modal .box:focus{outline:none}
.modal h3{font-family:var(--serif);font-size:21px;margin:0 0 8px}
.modal ul{padding-left:18px;margin:8px 0}
.modal .row{justify-content:flex-end}

/* 引理工坊 */
.lmg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:6px 0}
.lmt{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:var(--paper);font-family:var(--serif);font-size:22px;cursor:pointer;color:var(--ink);padding:0}
.lmt.sel{outline:2px solid var(--amber);outline-offset:1px}
.lmt.lv0{color:var(--amber);background:var(--amberBg)}
.lmt.lv2,.lmt.lv3,.lmt.lv4{background:var(--cyanBg)}
.lmt.lv5,.lmt.lv6,.lmt.lv7,.lmt.lv8{background:var(--cyanBg);border-color:var(--cyan)}
.lmt.lv9,.lmt.lv10,.lmt.lv11,.lmt.lv12{background:var(--amberBg);border-color:var(--amber)}
.lmt.lv13,.lmt.lv14,.lmt.lv15,.lmt.lv16{background:var(--amber);color:var(--bg);border-color:var(--amber)}
/* 图着色 */
.gsvg{width:100%;max-width:360px;display:block;margin:0 auto}
.gsvg line{stroke:var(--line2);stroke-width:2}
.gsvg line.bad{stroke:var(--coral);stroke-width:3}
.gsvg .gv{stroke:var(--ink);stroke-width:1.5;cursor:pointer}
.gsvg .gv.bad{stroke:var(--coral);stroke-width:3}
.tap-zone{fill:transparent;pointer-events:none}
.c0{fill:var(--panel)} .c1{fill:#E8A33D} .c2{fill:#3AA6D0} .c3{fill:#D9604A} .c4{fill:#5DB37A}
.gpal{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);cursor:pointer}
.gpal.c1{background:#E8A33D} .gpal.c2{background:#3AA6D0} .gpal.c3{background:#D9604A} .gpal.c4{background:#5DB37A}
.gpal.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--amber)}
/* 黑洞与星路 */
.bhc{width:100%;max-width:320px;display:block;margin:6px auto;border-radius:10px;background:#02060d}
.spc{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.spn{font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.spn.own{background:var(--cyanBg);border-color:var(--cyan);color:var(--cyan)}
.spn.nx{border-color:var(--amber);color:var(--amber);font-weight:600}
.spn.lk{border-style:dashed;opacity:.6}
.spn.dull{opacity:.45}
.spn.lk::before{content:"🔒";font-size:10px;margin-right:2px}
.card.spon{border-color:var(--amber)}
/* 无穷之塔 */
.tower{display:flex;flex-direction:column;gap:6px;max-width:340px;margin:0 auto}
.twf{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--paper);font-size:14px}
.twf.done{opacity:.45}
.twf.cur{border-color:var(--amber);background:var(--amberBg)}
.twf.ms b{color:var(--coral)}
.twp{flex-basis:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.twp div{height:100%;background:var(--amber)}
/* 质因数分解 */
.fzn{font-family:var(--serif);font-size:clamp(40px,9vw,72px);text-align:center;font-weight:600;letter-spacing:.02em}
.fzn.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fzp{font-family:var(--serif);font-size:20px;min-width:54px;text-align:center}
/* 分形 */
.frc{width:100%;max-width:260px;display:block;margin:6px auto;border:1px solid var(--line2);border-radius:8px;image-rendering:auto}
/* 星盘 */
.swgrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:640px){.swgrid{grid-template-columns:1fr}}
.swsvg{width:100%;max-width:420px;display:block;margin:0 auto}
.swsvg line{stroke:var(--line2);stroke-width:1.5}
.swsvg line.own{stroke:var(--cyan);stroke-width:2.5}
.star{cursor:pointer}
.star .star-point{fill:var(--panel);stroke:var(--line2);stroke-width:1.5}
.star text{font-family:var(--serif);font-size:11px;fill:var(--muted);pointer-events:none}
.star.own .star-point{fill:var(--cyan);stroke:var(--cyan)} .star.own text{fill:var(--bg)}
.star.can .star-point{stroke:var(--amber);stroke-width:2.5;fill:var(--amberBg)} .star.can text{fill:var(--amber)}
.star.reach .star-point{stroke:var(--amber);stroke-dasharray:3 3}
.star.lock{opacity:.45}
.star.sel .star-point{stroke:var(--coral);stroke-width:3}
/* 二十四点 */
.row24{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.card24{width:68px;height:92px;border-radius:10px;border:1px solid var(--line2);background:var(--paper);font-family:var(--serif);font-size:26px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.card24.sel{border-color:var(--amber);background:var(--amberBg);transform:translateY(-4px)}
.op24{font-family:var(--serif);font-size:20px;min-width:52px;text-align:center}
/* 数织 */
.ng-layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start;margin-top:8px}
.ngt{table-layout:fixed;border-collapse:collapse;width:100%;max-width:calc(48px + var(--ng-cols)*34px);margin:4px 0}
.ngt .ng-clues{width:48px}
.ngt th{font-family:var(--serif);font-weight:400;font-size:12px;color:var(--muted);vertical-align:bottom;padding:2px;line-height:1.15;text-align:center}
.ngt th.rc{text-align:right;white-space:nowrap;vertical-align:middle;padding-right:6px}
.ngt th.ok{color:var(--green)}
.ngt td{padding:0}
.ngc{width:100%;aspect-ratio:1;border:1px solid var(--line2);background:var(--paper);cursor:pointer;display:block;padding:0;margin:0}
.ngc.s1{background:var(--ink)}
.ngc.s2{background:var(--paper);background-image:linear-gradient(45deg,transparent 45%,var(--faint) 45%,var(--faint) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--faint) 45%,var(--faint) 55%,transparent 55%)}
.ulam{width:257px;max-width:100%;image-rendering:pixelated;border:1px solid var(--line2);border-radius:6px;margin-top:6px}
@media (max-width:740px){.grid.ng-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.ng-layout .ng-board{padding-inline:8px}.card24{width:60px;height:82px}}
@media (max-width:640px){
  .wrap{padding:0 10px 70px}
  .treebox{--rh:118px}
  .node{width:32%;padding:5px 6px}
  .node .nd{font-size:11.5px}
  .acts{margin-left:0;width:100%}

const NI = -Infinity, L10 = Math.log10;

let NOTA = 0; // 0 科学计数 1 纯对数 2 工程
function trim(v, dp) { let s = v.toFixed(dp); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s; }
function fmt(l, dp) {
  if (l === undefined || l === null || isNaN(l) || l === NI) return '0';
  if (l === Infinity) return '∞';
  if (dp === undefined) dp = 2;
  if (l < -2) return '≈0';
  if (l < 3) return trim(Math.pow(10, l), dp);
  if (l < 6) return Math.floor(Math.pow(10, l) + 1e-7).toLocaleString('en-US');
  if (l >= 1e6) { if (NOTA === 1) return 'e' + Math.round(l).toLocaleString('en-US'); const e2 = Math.floor(L10(l)); let m2 = l / Math.pow(10, e2); return 'e' + m2.toFixed(3) + 'e' + e2; }
  if (NOTA === 1) return 'e' + trim(l, 2);
  let e = Math.floor(l), m = Math.pow(10, l - e);
  if (m >= 9.995) { m = 1; e++; }
  if (NOTA === 2) { const e3 = Math.floor(e / 3) * 3; return trim(m * Math.pow(10, e - e3), 2) + 'e' + e3; }
  return m.toFixed(2) + 'e' + e;
}
const fn = (x, dp) => x === 0 ? '0' : (x < 0 ? '-' + fmt(lg(-x), dp) : fmt(lg(x), dp));
const fx = (x, dp) => (Math.abs(x) >= 1e9 && isFinite(x)) ? (x / Math.pow(10, Math.floor(Math.log10(Math.abs(x))))).toFixed(2) + 'e' + Math.floor(Math.log10(Math.abs(x))) : trim(x, dp === undefined ? 3 : dp);
function fmtT(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if (d) return d + '天' + h + '时' + m + '分';
  if (h) return h + '时' + m + '分' + x + '秒';
  if (m) return m + '分' + x + '秒';

}

    case 'e': return S.cst.got.e || S.u.x9 === 1;
    case 'phi': return !!S.res.done.s10;
    case 'r2': return !!S.res.done.s14;
    case 'ga': return S.cst.got.ga || S.u.x15 === 1;
    case 'de': return S.tier >= 6 && S.chap >= 4;
    case 'z3': return S.tier >= 6 && !!S.res.done.s24;
    case 'ge': return S.tier >= 6 && S.chap >= 11;
  }
  return false;
}

/* ---------- 无穷之塔 ---------- */
VIEWS.tw = () => {
  const f = S.tw.f, rows = [];
  for (let n = f + 4; n >= Math.max(0, f - 2); n--) { const ms = TWN[n + 1]; rows.push(`<div class="twf ${n === f ? 'cur' : n < f ? 'done' : ''} ${ms ? 'ms' : ''}"><span class="num">第 ${n + 1} 层</span>${ms ? `<b>${ms}</b>` : ''}${n === f ? `<div class="twp"><div ${B('twp', () => ({ w: 100 * S.tw.p }))}></div></div>` : ''}</div>`); }
  const next = Object.keys(TWN).map(Number).find(k => k > f);

  <div class="card"><div class="nm">攀登</div><div class="muted" ${B('twi', () => '当前第 ' + (S.tw.f + 1) + ' 层 · 本层还需 ' + fmtT((1 - S.tw.p) * twFloorTime(S.tw.f) / twSpeed(S)))}></div>

  return h;
};

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) act(el.dataset.a); });
document.addEventListener('keydown', e => {
  if (!e.repeat && (e.key === 'Enter' || e.key === ' ') && e.target.matches('svg [role="button"][data-a]')) {
    e.preventDefault(); act(e.target.dataset.a);
  }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el) inp(el.dataset.in, el); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && el.type === 'range') inp(el.dataset.in, el); });
$('skin').addEventListener('change', e => applySkin(e.target.value, true));
$('tabPicker').addEventListener('change', e => act('tab:' + e.target.value));
function scrollHorizontally(e) {
  const el = e.currentTarget;
  if (e.ctrlKey || e.shiftKey || e.deltaX || el.scrollWidth <= el.clientWidth + 1) return;
  const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? el.clientWidth : 1);
  const left = Math.max(0, Math.min(el.scrollWidth - el.clientWidth, el.scrollLeft + delta));
  if (Math.abs(left - el.scrollLeft) < 1) return;
  e.preventDefault(); el.scrollLeft = left;
}
for (const el of document.querySelectorAll('.formula,.reads,.stat-scroll,.tabs')) {
  el.addEventListener('wheel', scrollHorizontally, { passive: false });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); pushCloud(); } });
window.addEventListener('beforeunload', save);
let rsT = 0; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { revealTab(); }, 200); });

/* ---------------- 主循环 ---------------- */
function frame() {
  if (S.ult && S.ult.nw && S.ult.nw.length) { S.ult.nw.forEach(n => toast('图鉴发现：「' + n + '」，终极点 ×2')); S.ult.nw = []; }
  const now = Date.now(); let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (dt > 15) offline(dt, dt < 300); else if (dt > 0) { step(S, dt); runAuto(S); }
  if (now - lastSec > 1000) {
    lastSec = now;
    { const got = checkAch(S); if (got.length > 3) toast(`一次达成 <b>${got.length}</b> 个成就，详见「成就」页`); else got.forEach(a => toast('成就达成：<b>' + a[0] + '</b> · ' + a[1])); }
    checkNews();
    if (S.tier >= 2 && primeCache.n !== Math.floor(S.pr.n) && now - primeCache.at > 1500) { primeCache.at = now; primeCache.n = Math.floor(S.pr.n); primeCache.p = S.pr.n < 9e15 ? lastPrime(S.pr.n) : 0; }
    if (now - (S._sv || 0) > 10000) { S._sv = now; save(); }
    if (view === 'col') drawBH(); if (view === 'upt') drawPolys();
    if (cloud && now - lastCloud > 60000) { lastCloud = now; pushCloud(); }
    // 灵光一现
    if (!spark && !document.hidden && now > nextSpark && S.rbTot > 0) {
      spark = document.createElement('button'); spark.className = 'spark'; spark.dataset.a = 'spark'; spark.textContent = '✦'; spark.setAttribute('aria-label', '捕捉灵光');
      spark.style.left = rnd(8, 86) + '%'; spark.style.top = rnd(14, 62) + '%'; $('hero').appendChild(spark);
      const me = spark; setTimeout(() => { if (spark === me) { spark.remove(); spark = null; } }, 15000);
      nextSpark = now + rnd(240, 480) * 1000;
    }
  }
  const tv = TABS.find(t => t.id === view); if (!tv || !tv.on()) view = 'factor';
  renderHero(); renderBar(); renderTabs();
  const sig = sigOf(); if (sig !== viewSig) { viewSig = sig; buildView(); } else updBinds();
}
loadSkin(); load(); recalc(S); frame(); setInterval(frame, 50); initCloud();

</script>
