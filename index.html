<!DOCTYPE html>
<html lang="zh-CN" data-skin="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无尽演算 v1.0.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1F6; --paper:#F6FAFC; --panel:#FFFFFF; --line:rgba(16,46,76,.10); --line2:rgba(16,46,76,.22);
  --ink:#0F2B46; --muted:#4D6A85; --faint:#8AA2B8;
  --amber:#A66A00; --amberBg:rgba(214,150,20,.13); --cyan:#0A6C96; --cyanBg:rgba(10,108,150,.09);
  --coral:#B8432A; --green:#2D7F4A; --greenBg:rgba(45,127,74,.10);
  --shadow:0 1px 0 rgba(16,46,76,.06);
  --serif:"STIX Two Text","Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D2742; --paper:#10304F; --panel:#143858; --line:rgba(170,210,245,.10); --line2:rgba(170,210,245,.24);
  --ink:#E9F2F9; --muted:#A3BCD2; --faint:#6F8DA8;
  --amber:#F4BC4E; --amberBg:rgba(244,188,78,.13); --cyan:#82D4F4; --cyanBg:rgba(130,212,244,.10);
  --coral:#FF9073; --green:#8FDBA6; --greenBg:rgba(143,219,166,.12); --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D2742; --paper:#10304F; --panel:#143858; --line:rgba(170,210,245,.10); --line2:rgba(170,210,245,.24);
  --ink:#E9F2F9; --muted:#A3BCD2; --faint:#6F8DA8;
  --amber:#F4BC4E; --amberBg:rgba(244,188,78,.13); --cyan:#82D4F4; --cyanBg:rgba(130,212,244,.10);
  --coral:#FF9073; --green:#8FDBA6; --greenBg:rgba(143,219,166,.12); --shadow:none; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}

/* 顶部 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 4px}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.02em}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.tierb{font-family:var(--serif);font-size:15px;color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:2px 12px;white-space:nowrap}

/* 公式（主视觉） */
.hero{position:relative;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:18px 18px 14px;margin:8px 0 12px;box-shadow:var(--shadow);overflow:hidden}
.pts{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.pts .big{font-family:var(--serif);font-size:clamp(30px,6vw,46px);font-weight:600;line-height:1.1}
.pts .lbl{color:var(--muted);font-size:13px}
.rate{color:var(--muted);font-size:13px}
.rate b{color:var(--ink);font-weight:500}
.formula{font-family:var(--serif);font-size:clamp(22px,4.6vw,38px);text-align:center;margin:16px 0 8px;line-height:1.5;word-spacing:.05em;overflow-x:auto;white-space:nowrap;padding-bottom:4px}
.formula sup{font-size:.58em;vertical-align:.95em;margin-left:1px}
.formula i{font-style:italic;cursor:pointer;padding:0 1px;border-radius:4px}
.formula i:hover{background:var(--cyanBg)}
.formula .fp{color:var(--amber)} .formula .fl{color:var(--cyan)} .formula .ft{color:var(--coral)}
.formula .op{color:var(--muted);padding:0 .12em}
.reads{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:2px}
.chip{font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:1px 10px;color:var(--muted);background:var(--panel)}
.chip i{font-family:var(--serif);font-size:14px;color:var(--ink);margin-right:4px}
.tickbar{height:4px;border-radius:2px;background:var(--line);margin:12px 0 2px;overflow:hidden}
.tickbar div{height:100%;width:0;background:var(--amber)}
.tickbar.fast div{width:100%!important;opacity:.55;background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 14px);animation:slide 0.6s linear infinite}
@keyframes slide{from{background-position:0 0}to{background-position:14px 0}}
.ticknote{font-size:12px;color:var(--faint);display:flex;justify-content:space-between}
.boost{color:var(--coral)}

/* 货币与快捷重置 */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cur{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;min-width:120px;box-shadow:var(--shadow)}
.cur .k{font-size:12px;color:var(--muted)}
.cur .v{font-family:var(--serif);font-size:19px;font-weight:600}
.cur .s{font-size:11.5px;color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 14px;cursor:pointer;min-height:38px;text-align:left;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{border-color:var(--amber);background:var(--amberBg)}
.btn.cy{border-color:var(--cyan);background:var(--cyanBg)}
.btn.warn{border-color:var(--coral);color:var(--coral)}
.btn small{display:block;font-size:11.5px;color:var(--muted)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}

/* 页签 */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line2);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:500}
.tab .dot{position:absolute;top:7px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* 通用面板 */
.sec{margin:18px 0 8px;font-family:var(--serif);font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .h{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.card.dim{opacity:.55}
.card .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card .sym{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--amber)}
.card .sym.l{color:var(--cyan)}
.card .nm{font-weight:500}
.card .ds{font-size:13px;color:var(--muted);margin:4px 0}
.card .fm{font-family:var(--serif);font-size:15px;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .ok{color:var(--green)} .am{color:var(--amber)} .cy{color:var(--cyan)} .co{color:var(--coral)}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.pill{font-size:11.5px;border-radius:999px;padding:0 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--green);color:var(--green)}
.pill.am{border-color:var(--amber);color:var(--amber)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--cyan)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--amber);width:16px;height:16px}
select,input[type=text],textarea{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:4px 8px}
input[type=text]{width:110px}
textarea{width:100%;min-height:90px;font-size:12px}
.ms li{margin:2px 0}
ul.ms{padding-left:18px;margin:6px 0;font-size:13.5px}
.ms .got{color:var(--green)}

/* 升级树 */
.treebox{position:relative;margin:6px 0 10px;--rh:96px}
.treebox svg{position:absolute;inset:0;width:100%;pointer-events:none}
.treebox path{stroke:var(--line2);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.treebox path.own{stroke:var(--cyan)}
.node{position:absolute;width:31%;transform:translateX(-50%);height:calc(var(--rh) - 14px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.node .nn{font-weight:500;font-size:13.5px;display:flex;justify-content:space-between;gap:4px}
.node .nd{font-size:12px;color:var(--muted);line-height:1.35;flex:1;overflow:hidden}
.node .nc{font-size:11.5px;color:var(--faint)}
.node.own{background:var(--cyanBg);border-color:var(--cyan)}
.node.own .nc{color:var(--cyan)}
.node.can{border-color:var(--amber);background:var(--amberBg)}
.node.alt{opacity:.38;border-style:dashed}
.node.res,.node.pre{opacity:.62}
.node .fork{font-size:10.5px;color:var(--coral);border:1px solid var(--coral);border-radius:999px;padding:0 5px;white-space:nowrap;align-self:flex-start}
.tierline{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);font-size:11px;color:var(--faint);padding-left:2px}

/* 幻方 */
.msq{display:grid;gap:4px;margin:8px 0}
.msq button{aspect-ratio:1;border:1px solid var(--line2);background:var(--panel);border-radius:8px;font-family:var(--serif);font-size:clamp(16px,4vw,24px);cursor:pointer;min-width:0;padding:0}
.msq button.lineok{background:var(--greenBg);border-color:var(--green)}
.msq .sum{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;color:var(--faint)}
.msq .sum.ok{color:var(--green)}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.pal button{width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-family:var(--serif);font-size:16px;cursor:pointer}
.pal button.sel{border-color:var(--amber);background:var(--amberBg)}
.pal button.used{opacity:.35}

/* 素数 */
.sieve{font-family:var(--serif);font-size:clamp(24px,5vw,34px);font-weight:600;word-break:break-all}

/* 灵光 */
.spark{position:absolute;width:42px;height:42px;border-radius:50%;border:1px solid var(--amber);background:var(--amberBg);color:var(--amber);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite;z-index:3}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.spark,.tickbar.fast div{animation:none}}

/* 提示与弹窗 */
.toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30;max-width:min(360px,calc(100vw - 24px))}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:9px;padding:8px 12px;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:rgba(6,20,34,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:520px;width:100%;padding:18px 20px;max-height:85vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:21px;margin:0 0 8px}
.modal ul{padding-left:18px;margin:8px 0}
.modal .row{justify-content:flex-end}

@media (max-width:640px){
  .wrap{padding:0 10px 70px}
  .treebox{--rh:118px}
  .node{width:32%;padding:5px 6px}
  .node .nd{font-size:11.5px}
  .acts{margin-left:0;width:100%}
  .acts .btn{flex:1 1 45%}
  .cur{min-width:0;flex:1 1 30%}
}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
.top{align-items:center}
.top-tools{display:flex;align-items:center;gap:8px;flex:none}
.skin-picker{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.skin-picker select{font-size:13px;min-height:32px}
.rail-brand,.workspace-stats,.hero-heading,.workspace-actions,.nav-symbol,.formula-output{display:none}
.formula{text-align:start;padding-inline:1px}
.formula-line{display:block;width:max-content;min-width:100%;text-align:center}
.reads{flex-wrap:nowrap;overflow-x:auto;justify-content:safe center;white-space:nowrap;padding:3px}
main,.bar,.tabs,.hero,.grid,.card{min-width:0}
#curs{display:contents}
.stat-scroll{display:flex;gap:8px;min-width:0;flex:1 1 auto;overflow-x:auto}
[data-skin="blueprint"] .stat-scroll:has(#curs:empty){display:none}
.stat-scroll .cur{flex-shrink:0}
.skin-picker select:focus-visible,.formula:focus-visible,.reads:focus-visible,.stat-scroll:focus-visible,#view:focus-visible{outline-offset:-2px}
.signature{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));padding:4px 8px;color:var(--ink);display:flex;align-items:baseline;gap:6px;font:25px/1 var(--serif);pointer-events:none;background:var(--bg);border-radius:5px}
.signature-limit{display:inline-flex;flex-direction:column;align-items:center}
.signature-limit small{font-size:10px;line-height:1.15;white-space:nowrap}

/* 演算工作台皮肤 */
:root[data-skin="workspace"]{
  --bg:#f4f7f8;--paper:#fff;--panel:#fff;--rail-bg:#f7f9fa;--line:#e0e7ea;--line2:#d5e0e4;
  --ink:#182b33;--muted:#546c77;--faint:#637b87;--amber:#16766f;--amberBg:#e8f3f1;--cyan:#16766f;--cyanBg:#e8f3f1;
  --coral:#ac4947;--green:#147851;--greenBg:#e2f2ec;--shadow:none;color-scheme:light;
  --u:clamp(.73px,.09765625dvh,1px);--rail:calc(216 * var(--u));--gutter:clamp(16px,2.2vw,36px);
}
:root[data-skin="workspace"][data-theme="dark"]{--bg:#11191d;--paper:#172227;--panel:#172227;--rail-bg:#131e23;--line:#2b3b42;--line2:#384c54;--ink:#e2ecef;--muted:#a1b3bb;--faint:#9aafb8;--amber:#7ccfc4;--amberBg:#243e3e;--cyan:#7ccfc4;--cyanBg:#243e3e;--coral:#f09a9e;--green:#8eddb1;--greenBg:#234337;color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-skin="workspace"]:not([data-theme="light"]){--bg:#11191d;--paper:#172227;--panel:#172227;--rail-bg:#131e23;--line:#2b3b42;--line2:#384c54;--ink:#e2ecef;--muted:#a1b3bb;--faint:#9aafb8;--amber:#7ccfc4;--amberBg:#243e3e;--cyan:#7ccfc4;--cyanBg:#243e3e;--coral:#f09a9e;--green:#8eddb1;--greenBg:#234337;color-scheme:dark}}
[data-skin="workspace"] body{background-image:none}
[data-skin="workspace"] .wrap{max-width:none;padding:0 var(--gutter) 74px}
[data-skin="workspace"] .top{min-height:calc(62 * var(--u));margin-inline:calc(-1 * var(--gutter));padding:6px var(--gutter);border-bottom:1px solid var(--line2);background:var(--panel)}
[data-skin="workspace"] .top .brand{color:var(--ink)}
[data-skin="workspace"] .skin-picker select,[data-skin="workspace"] .btn,[data-skin="workspace"] .card,[data-skin="workspace"] .hero{border-radius:7px}
[data-skin="workspace"] .hero-heading{display:block;margin:0;font-size:18px;font-weight:600}
[data-skin="workspace"] .blueprint-heading{display:none}
[data-skin="workspace"] .hero{margin:0;padding:18px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:8px}
[data-skin="workspace"] .hero .hero-heading{order:-1}
[data-skin="workspace"] .pts .big{font-size:34px}
[data-skin="workspace"] .formula{font-size:42px;margin:18px 0 4px}
[data-skin="workspace"] .formula i{color:var(--ink)}
[data-skin="workspace"] .formula-output{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-bottom:8px;color:var(--muted);font-size:13px;text-align:center}
[data-skin="workspace"] .formula-output b{font:600 29px/1.15 var(--serif);color:var(--ink);overflow-wrap:anywhere}
[data-skin="workspace"] .formula-output::before{content:'=';font:26px/1.1 var(--serif);color:var(--ink)}
[data-skin="workspace"] .bar{margin:0 calc(-1 * var(--gutter));padding:8px var(--gutter);background:var(--panel);border-bottom:1px solid var(--line2);gap:0}
[data-skin="workspace"] .workspace-stats,[data-skin="workspace"] #curs{display:contents}
[data-skin="workspace"] .stat-scroll{display:flex;align-items:stretch;overflow-x:auto;width:100%;padding:3px 0;gap:0}
[data-skin="workspace"] .cur{min-width:132px;border:0;border-right:1px solid var(--line2);border-radius:0;padding:4px 14px;white-space:nowrap}
[data-skin="workspace"] .stat-scroll .cur{flex:1 0 auto}
[data-skin="workspace"] .stat-scroll .cur:last-child{border-right:0}
[data-skin="workspace"] .workspace-stats .cur:first-child{padding-inline-start:2px}
[data-skin="workspace"] .cur .v{font-size:22px;line-height:1.2}
[data-skin="workspace"] .bar .acts{display:none}
[data-skin="workspace"] .workspace-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(224px,100%),1fr));gap:12px}
[data-skin="workspace"] .workspace-actions .btn{display:grid;align-content:space-between;gap:12px;min-height:81px;padding:13px 16px;font-weight:600}
[data-skin="workspace"] .workspace-actions .btn small{font-weight:400}
[data-skin="workspace"] .workspace-actions .btn:disabled{opacity:1;color:var(--muted);background:var(--paper)}
[data-skin="workspace"] .tabs{margin-bottom:0}
[data-skin="workspace"] .wrap[data-view="factor"] #view{border:1px solid var(--line2);border-radius:7px;background:var(--panel);padding:12px 16px;overflow-y:auto}
[data-skin="workspace"] .wrap[data-view="factor"] #view .grid{grid-template-columns:minmax(0,1fr);gap:0}
[data-skin="workspace"] .wrap[data-view="factor"] #view .sec{margin-top:3px}
[data-skin="workspace"] .wrap[data-view="factor"] #view .sec:not(:first-child){margin-top:16px}
[data-skin="workspace"] .wrap[data-view="factor"] #view .card{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0}
@media(min-width:920px){
  [data-skin="workspace"] .wrap{margin-inline-start:var(--rail);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-areas:"top top" "bar bar" "hero view" "actions actions";gap:16px;align-items:start}
  [data-skin="workspace"] .wrap:not([data-view="factor"]){grid-template-areas:"top top" "bar bar" "hero hero" "actions actions" "view view"}
  [data-skin="workspace"] .top{grid-area:top;margin-bottom:-16px}
  [data-skin="workspace"] .bar{grid-area:bar;min-height:calc(94 * var(--u));align-content:center}
  [data-skin="workspace"] .hero{grid-area:hero}
  [data-skin="workspace"] .workspace-actions{grid-area:actions}
  [data-skin="workspace"] #view{grid-area:view}
  [data-skin="workspace"] .wrap[data-view="factor"] #view{height:clamp(340px,40.5dvh,470px)}
  [data-skin="workspace"] .wrap:not([data-view="factor"]) .hero{padding-block:10px;gap:3px}
  [data-skin="workspace"] .wrap:not([data-view="factor"]) .hero .formula{font-size:24px;margin:4px 0}
  [data-skin="workspace"] .wrap:not([data-view="factor"]) .pts .big{font-size:24px}

    const u = cstUnl(S, c.id);
    h += `<div class="card ${u ? '' : 'dim'}"><div class="t"><span><span class="sym l">${c.s}</span> <span class="nm">${c.n}</span></span><span class="muted">${u ? '' : c.how}</span></div>
    <div class="ds">${c.d}</div>${u ? `<div class="muted">已算出 <b class="num" ${B('cd_' + c.id, () => fmtInt(S.cst.D[c.id]))}></b> 位 · 效果 <b class="cy" ${B('ce_' + c.id, () => c.e(S.cst.D[c.id]))}></b></div>
    <div class="row"><label class="tgl">权重 <input type="range" min="0" max="10" step="1" value="${S.cst.w[c.id]}" data-in="w:${c.id}" aria-label="${c.n}权重"> <b ${B('cw_' + c.id, () => String(S.cst.w[c.id]))}></b></label></div>` : ''}</div>`;
  });
  return h + `</div><p class="note">位数的增长速度会随位数增加而放缓（约为时间的 2/3 次方），把算力集中给一个常数收益递减。常数位数永久保留。</p>`;
};
VIEWS.promo = () => {
  let h = `<div class="sec">晋升<span class="h">晋升是最高的重置层：重置除研究、猜想、常数、素数、幻方、里程碑与成就以外的一切</span></div>`;
  if (S.tier < 5) {
    const req = TIERS[S.tier].req;
    h += `<div class="grid"><div class="card"><div class="nm">${TIERN[S.tier]} → ${TIERN[S.tier + 1]}</div><div class="muted">需要点数 ${fmt(req)}</div>
    <div class="prog"><div ${B('pp', () => ({ w: Math.max(0, Math.min(100, pz(S.P) / req * 100)) }))}></div></div><div class="muted" ${B('ppt', () => '当前 ' + fmt(S.P) + '（' + fx(Math.max(0, Math.min(100, pz(S.P) / req * 100)), 1) + '%，按数量级计）')}></div>
    <div class="row"><button class="btn" data-a="promo" ${B('pb', () => ({ c: 'btn ' + (canPromote(S) ? 'cy' : ''), d: !canPromote(S) }))}>晋升至${TIERN[S.tier + 1]}</button></div></div>
    <div class="card"><div class="nm">${TIERN[S.tier + 1]}将带来</div><ul class="ms">${PROMO_TEXT[S.tier + 1].map(x => '<li>' + x + '</li>').join('')}</ul></div></div>`;
  } else {
    h += `<div class="grid"><div class="card"><div class="nm">你已到达 v1.0.0 的最高阶</div><div class="ds">继续推进，冲击极限 e2000。六阶将在后续版本开放。</div>
    <div class="prog"><div ${B('pp', () => ({ w: Math.max(0, Math.min(100, pz(S.P) / K.endGoal * 100)) }))}></div></div><div class="muted" ${B('ppt', () => '当前 ' + fmt(S.P) + ' / ' + fmt(K.endGoal))}></div></div></div>`;
  }
  const hist = Object.entries(S.st.promoAt).map(([t, s]) => `<li>${TIERN[t]}：游戏时间 ${fmtT(s)}</li>`).join('');
  if (hist) h += `<div class="sec">历程</div><ul class="ms">${hist}</ul>`;
  return h;
};
VIEWS.ach = () => {
  const n = Object.keys(S.ach).length;
  return `<div class="sec">成就<span class="h">${n} / ${ACH.length} · 每个成就使 a 的值 ×1.05（当前 ×${fmt(n * L10(1.05))}）</span></div><div class="grid">${ACH.map((a, i) => `<div class="card ${S.ach[i] ? '' : 'dim'}"><div class="t"><span class="nm">${a[0]}</span>${S.ach[i] ? '<span class="pill ok">已达成</span>' : ''}</div><div class="ds">${a[1]}</div></div>`).join('')}</div>`;
};
VIEWS.stat = () => {
  const rows = [['总游戏时间', () => fmtT(S.st.time)], ['当前阶时长', () => fmtT(S.st.tierT[S.tier] || 0)], ['本轮重生时长', () => fmtT(S.rbT)], ['获得点数次数', () => fmtInt(S.ticks)],
  ['本阶最高点数', () => fmt(S.Pbest)], ['历史最高点数', () => fmt(S.Pall)], ['累计重生', () => String(S.rbTot)], ['累计证明', () => String(S.pfTot)], ['累计公理化', () => String(S.axTot)],
  ['猜想证毕', () => cjTotal(S) + ' / 24'], ['完成研究', () => Object.keys(S.res.done).length + ' / ' + RS.length], ['捕捉灵光', () => String(S.st.sparks || 0)], ['重置升级树', () => String(S.st.respec || 0)]];
  return `<div class="sec">统计</div><div class="grid">${rows.map((r, i) => `<div class="card"><div class="muted">${r[0]}</div><div class="num" style="font-size:20px" ${B('st' + i, r[1])}></div></div>`).join('')}</div>`;
};
VIEWS.opt = () => `<div class="sec">设置</div><div class="grid">
  <div class="card"><div class="nm">数字格式</div><div class="row"><select data-in="nota"><option value="0" ${NOTA === 0 ? 'selected' : ''}>科学计数 1.23e45</option><option value="1" ${NOTA === 1 ? 'selected' : ''}>对数 e45.09</option><option value="2" ${NOTA === 2 ? 'selected' : ''}>工程计数 12.3e45</option></select></div></div>
  <div class="card"><div class="nm">外观</div><div class="row"><select data-in="theme"><option value="0" ${!S.opt.theme ? 'selected' : ''}>跟随系统</option><option value="1" ${S.opt.theme === 1 ? 'selected' : ''}>浅色</option><option value="2" ${S.opt.theme === 2 ? 'selected' : ''}>深色</option></select></div>
  <div class="row"><label class="tgl"><input type="checkbox" data-in="conf" ${S.opt.conf ? 'checked' : ''}>公理化与晋升前确认</label></div></div>
  <div class="card"><div class="nm">存档</div><div class="ds">每 10 秒自动保存到本机${cloud ? '，并同步到你的 claude.ai 账号' : ''}。</div><div class="muted" ${B('cl', () => cloud ? '云存档：' + (cloud.at ? '最近同步 ' + fmtT((Date.now() - cloud.at) / 1000) + '前' : '连接中') : '云存档：当前环境不可用，仅本机保存')}></div>
  <div class="row"><button class="btn sm" data-a="save">立即保存</button><button class="btn sm" data-a="exp">导出存档</button><button class="btn sm" data-a="imp">导入存档</button></div>
  <textarea id="saveBox" placeholder="导出的存档字符串会出现在这里；导入时把存档粘贴进来再点「导入存档」"></textarea></div>
  <div class="card"><div class="nm">危险操作</div><div class="ds">彻底删除进度，从头开始。</div><div class="row"><button class="btn sm warn" data-a="hard">删除存档并重新开始</button></div></div>
  </div><p class="note">无尽演算 v1.0.0 · 共 5 阶、4 个重置层、${RU.length + PU.length + AU.length} 个升级节点、8 个猜想、${RS.length} 项研究、5 个常数、3 个幻方、${ACH.length} 个成就。</p>`;

/* ---------------- 操作 ---------------- */
function act(a) {
  const p = a.split(':');
  switch (p[0]) {
    case 'tab': view = p[1]; viewSig = ''; $('view').scrollTop = 0; window.scrollTo({ top: document.documentElement.dataset.skin === 'workspace' && window.innerWidth >= 920 ? 0 : Math.min(window.scrollY, $('tabs').offsetTop - 4) }); break;
    case 'buy': buyFactor(S, p[1], p[2] === 'max'); break;
    case 'upg': if (buyUpg(S, p[1])) viewSig = ''; else { const x = UPG[p[1]], st = upgState(S, x); if (st === 'alt') toast('同一分叉只能选一条路。可以在上方「重置升级树」后改选。'); } break;
    case 'upgall': buyAllUpg(S, p[1]); viewSig = ''; break;
    case 'respec': confirmDo('重置升级树', `<p>${LAYER[p[1]].name}升级树中已购买的节点将全部移除，花费的${CURN[LAYER[p[1]].cur]}全额退还。</p><p>同时会进行一次<b>不获得收益</b>的${p[1] === 'r' ? '点数' : p[1] === 'p' ? '重生层' : '证明层'}重置。</p>`, '确认重置', () => respec(S, p[1])); break;
    case 'rb': doRebirth(S); break;
    case 'pf': doProof(S); viewSig = ''; break;
    case 'ax': if (S.opt.conf) confirmDo('公理化', `<p>将获得 <b>${fmt(G.axGain)}</b> 公理，并重置证明层及以下的全部进度。</p>`, '公理化', () => doAxiom(S)); else doAxiom(S); break;
    case 'promo': if (!canPromote(S)) break; confirmDo('晋升至' + TIERN[S.tier + 1], `<p>晋升将重置点数、三个重置层的货币与升级。研究、猜想、常数、素数筛、幻方、里程碑与成就会保留。</p><ul>${PROMO_TEXT[S.tier + 1].map(x => '<li>' + x + '</li>').join('')}</ul>`, '晋升', () => { doPromote(S); heroTier = 0; view = 'factor'; save(); toast('晋升至' + TIERN[S.tier] + '！'); }); break;
    case 'cj': confirmDo('开始猜想「' + CJ[+p[1] - 1].n + '」', `<p>限制：${CJ[+p[1] - 1].d}</p><p>将立即进行一次证明重置（不获得定理）。目标：点数达到 ${fmt(chalGoal(S, +p[1]))}。</p>`, '开始', () => enterChal(S, +p[1])); break;
    case 'cjx': confirmDo('放弃猜想', '<p>将退出猜想并进行一次证明重置（不获得定理）。</p>', '放弃', () => exitChal(S)); break;
    case 'res': resStart(S, p[1]); viewSig = ''; break;
    case 'sieve': buySieve(S); break;
    case 'msz': msSize = +p[1]; viewSig = ''; break;
    case 'msp': msSel[p[1]] = msSel[p[1]] === +p[2] ? 0 : +p[2]; viewSig = ''; break;
    case 'msc': { const n = +p[1], i = +p[2], before = MS(S, n); msSet(S, n, i, msSel[n] || 0); if (!before && MS(S, n)) toast(`${n}×${n} 幻方完成！`); viewSig = ''; break; }
    case 'msclr': S.ms[p[1]] = []; viewSig = ''; break;
    case 'save': save(); pushCloud(); toast('已保存'); break;
    case 'exp': { const b = $('saveBox'); if (b) { b.value = encodeSave(S); b.select(); try { navigator.clipboard.writeText(b.value); toast('存档已复制到剪贴板'); } catch (e) { toast('存档已显示在文本框中'); } } break; }
    case 'imp': { const b = $('saveBox'); if (!b || !b.value.trim()) { toast('请先把存档粘贴到文本框中'); break; } try { const T = decodeSave(b.value); confirmDo('导入存档', '<p>当前进度将被导入的存档覆盖。</p>', '导入', () => { S = T; NOTA = S.opt.nota || 0; applyTheme(); heroTier = 0; recalc(S); save(); toast('导入成功'); }); } catch (e) { toast('存档格式不正确，请检查是否复制完整'); } break; }
    case 'hard': confirmDo('删除存档', '<p>所有进度将永久删除，且无法恢复。</p>', '删除并重新开始', () => { S = newState(); heroTier = 0; recalc(S); save(); pushCloud(); view = 'factor'; }); break;
    case 'spark': if (spark) { const ks = ['boost', 'sieve']; if (S.res.act.length) ks.push('res'); if (S.tier >= 4) ks.push('cst'); toast('灵光一现：' + applySpark(S, ks[Math.floor(Math.random() * ks.length)])); spark.remove(); spark = null; } break;
  }
  recalc(S);
}
function inp(k, el) {
  const p = k.split(':');
  switch (p[0]) {
    case 'fa': S.auto[p[1]] = el.checked ? 1 : 0; break;
    case 'ao': S.auto[p[1]].on = el.checked ? 1 : 0; break;
    case 'am': S.auto[p[1]].m = +el.value; break;
    case 'av': S.auto[p[1]].v = el.value; break;
    case 'w': S.cst.w[p[1]] = +el.value; break;
    case 'cjauto': S.auto.cj = el.checked ? 1 : 0; break;
    case 'nota': NOTA = S.opt.nota = +el.value; heroTier = 0; viewSig = ''; break;
    case 'theme': S.opt.theme = +el.value; applyTheme(); break;
    case 'conf': S.opt.conf = el.checked ? 1 : 0; break;
  }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) act(el.dataset.a); });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el) inp(el.dataset.in, el); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && el.type === 'range') inp(el.dataset.in, el); });
$('skin').addEventListener('change', e => applySkin(e.target.value, true));
for (const el of document.querySelectorAll('.formula,.reads,.stat-scroll,.tabs')) {
  el.addEventListener('wheel', e => {
    if (e.ctrlKey || e.shiftKey || e.deltaX || el.scrollWidth <= el.clientWidth + 1) return;
    const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? el.clientWidth : 1);
    const left = Math.max(0, Math.min(el.scrollWidth - el.clientWidth, el.scrollLeft + delta));
    if (Math.abs(left - el.scrollLeft) < 1) return;
    e.preventDefault(); el.scrollLeft = left;
  }, { passive: false });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); pushCloud(); } });
window.addEventListener('beforeunload', save);
let rsT = 0; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { viewSig = ''; }, 200); });

/* ---------------- 主循环 ---------------- */
function frame() {
  const now = Date.now(); let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (dt > 15) offline(dt, dt < 300); else if (dt > 0) { step(S, dt); runAuto(S); }
  if (now - lastSec > 1000) {
    lastSec = now;
    { const got = checkAch(S); if (got.length > 3) toast(`一次达成 <b>${got.length}</b> 个成就，详见「成就」页`); else got.forEach(a => toast('成就达成：<b>' + a[0] + '</b> · ' + a[1])); }
    checkNews();
    if (S.tier >= 2 && primeCache.n !== Math.floor(S.pr.n) && now - primeCache.at > 1500) { primeCache.at = now; primeCache.n = Math.floor(S.pr.n); primeCache.p = S.pr.n < 9e15 ? lastPrime(S.pr.n) : 0; }
    if (now - (S._sv || 0) > 10000) { S._sv = now; save(); }
    if (cloud && now - lastCloud > 60000) { lastCloud = now; pushCloud(); }
    // 灵光一现
    if (!spark && !document.hidden && now > nextSpark && S.rbTot > 0) {
      spark = document.createElement('button'); spark.className = 'spark'; spark.dataset.a = 'spark'; spark.textContent = '✦'; spark.setAttribute('aria-label', '捕捉灵光');
      spark.style.left = rnd(8, 86) + '%'; spark.style.top = rnd(14, 62) + '%'; $('hero').appendChild(spark);
      const me = spark; setTimeout(() => { if (spark === me) { spark.remove(); spark = null; } }, 15000);
      nextSpark = now + rnd(240, 480) * 1000;
    }
  }
  const tv = TABS.find(t => t.id === view); if (!tv || !tv.on()) view = 'factor';
  renderHero(); renderBar(); renderTabs();
  const sig = sigOf(); if (sig !== viewSig) { viewSig = sig; buildView(); } else updBinds();
}
loadSkin(); load(); recalc(S); frame(); setInterval(frame, 50); initCloud();

</script>
</body>
</html>
